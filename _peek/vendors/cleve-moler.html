<p class="peek-title"><b>Cleve Moler</b></p>
<p class="peek-meta">Person · 1 tool</p>
<p>Cleve Barry Moler was an American mathematician and computer programmer who specialized in numerical analysis. In the mid to late 1970s, he was one of the authors of LINPACK and EISPACK, Fortran libraries for numerical computing.</p><p class="peek-credit">Wikipedia, CC BY-SA 4.0</p></article>
